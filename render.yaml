# Render 蓝图: 把本仓库直接连上去即可自动建站
# 用法: Render 控制台 -> New -> Blueprint -> 选这个仓库
services:
  - type: web
    name: north-loading-trend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
